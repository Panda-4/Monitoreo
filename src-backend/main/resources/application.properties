spring.application.name=dictamenes-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_Dictamenes?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}

# Hibernate ddl auto (update, create, create-drop, validate, none)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# MySQL dialect is auto-detected by Spring Boot 3.2+ — no need to specify

# Puerto del backend
server.port=${SERVER_PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:RGljdGFtZW5lc0dFTS1TdXBlclNlY3JldEtleTIwMjYtUXVlTmFkaWVQdWVkZUFkaXZpbmFy}
jwt.expiration=${JWT_EXPIRATION:86400000}
